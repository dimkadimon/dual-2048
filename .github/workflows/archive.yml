# Keeps public/archive.json — the permanent, in-repo snapshot of every score —
# minutes away from the live store. See the README ("Keeping the history
# forever"). It needs no secrets (the store is public and the job commits with
# the workflow's own token) and it only ever adds rows.

name: Archive leaderboard

on:
  schedule:
    # Every 5 minutes. The snapshot is the floor the game and the board fall back
    # to when the store refuses a host (kvdb rate-limits by IP), so it has to be
    # minutes old, not an hour: an hourly snapshot meant a fresh personal best was
    # missing from the board exactly when people were playing.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge the store into the archive
        run: node tools/migrate.js --write

      - name: Commit the snapshot
        run: |
          git config user.name  'leaderboard-archive'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet -- public/archive.json; then
            echo "archive already up to date"
            exit 0
          fi
          git add public/archive.json
          git commit -m "archive: leaderboard snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # The job commits to main, but the site is served from gh-pages, so the
      # snapshot players download would otherwise stay frozen at whatever was
      # there the last time somebody published. Push the single file across.
      - name: Publish the snapshot to the site
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin gh-pages
          git checkout -q -B gh-pages FETCH_HEAD
          cp "$GITHUB_WORKSPACE/public/archive.json" archive.json
          git add archive.json
          if git diff --quiet --cached -- archive.json; then
            echo "site snapshot already up to date"
            exit 0
          fi
          git -c user.name='leaderboard-archive' -c user.email='actions@users.noreply.github.com' \
              commit -q -m "archive: site snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
